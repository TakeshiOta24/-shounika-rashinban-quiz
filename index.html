<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="小児科羅針盤｜小児救急100問 実践トレーニング">
<meta property="og:description" content="小児科羅針盤をもとに、小児救急の知識を100問で反復学習する実践トレーニング。">
<title>小児科羅針盤｜小児救急100問 実践トレーニング</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657083;--accent:#2457c5;--accent2:#0b7b72;--ok:#157347;--ng:#b42318;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:780px;margin:0 auto;padding:22px 15px 60px}
.hero{background:linear-gradient(135deg,#eaf2ff,#ecfbf6);border:1px solid #dbe7f2;border-radius:24px;padding:22px;margin-bottom:16px}
.eyebrow{font-size:13px;color:var(--accent2);font-weight:800;letter-spacing:.08em}
h1{font-size:28px;line-height:1.35;margin:5px 0 8px}
.sub{color:var(--muted);line-height:1.7;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 28px rgba(20,35,70,.06);padding:20px}
.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3}
.badge.cat{background:#ecfdf5;color:#0f766e}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0 18px}
.progress>div{height:100%;background:linear-gradient(90deg,#2457c5,#0b7b72);width:0;transition:.25s}
.q{font-weight:800;font-size:20px;line-height:1.6;margin:0 0 17px}
.options{display:grid;gap:10px}
button.option{width:100%;text-align:left;border:1px solid #d7dee8;background:#fff;border-radius:14px;padding:14px 15px;font-size:16px;line-height:1.5;cursor:pointer}
button.option:hover{background:#f8fafc;border-color:#94a3b8}
button.option:disabled{cursor:default}
button.option.correct{border-color:#86efac;background:#f0fdf4}
button.option.wrong{border-color:#fca5a5;background:#fef2f2}
.feedback{display:none;margin-top:16px;padding:14px;border-radius:14px;line-height:1.7;font-size:15px}
.feedback.ok{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.feedback.ng{display:block;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2f7;color:#243447}
.ghost{background:#fff;border:1px solid #d7dee8;color:#344054}
.hidden{display:none!important}
.result{text-align:center;padding:8px 0}
.score{font-size:50px;font-weight:900;margin:8px 0 0}
.rank{font-size:19px;font-weight:800;margin:2px 0 15px}
.small{font-size:13px;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;text-align:left}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:12px}
.stat b{display:block;font-size:19px;margin-top:2px}
.footer{font-size:12px;color:#7b8493;line-height:1.65;margin-top:15px}
.start{text-align:center;padding:10px 0}
.start p{color:var(--muted);line-height:1.8}
.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
@media(max-width:520px){h1{font-size:25px}.q{font-size:18px}.modeRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <div class="eyebrow">小児科羅針盤</div>
  <h1>小児救急クイズ 100問</h1>
  <div class="sub">基本から難問まで。1問ごとに回答すると、その場で解説が表示されます。</div>
</section>

<main class="card">
  <div id="start" class="start">
    <div class="eyebrow">QUIZ MODE</div>
    <h2>挑戦する問題数を選択</h2>
    <p>100問通しでも、ランダム20問でも遊べます。<br>スマホ・LINE・Notion・Xから同じページを利用できます。</p>
    <div class="modeRow">
      <button class="btn primary" onclick="startQuiz(100,false)">100問すべて</button>
      <button class="btn secondary" onclick="startQuiz(20,true)">ランダム20問</button>
    </div>
  </div>

  <div id="quiz" class="hidden">
    <div class="topline">
      <div class="badges">
        <div id="counter" class="badge"></div>
        <div id="category" class="badge cat"></div>
        <div id="difficulty" class="badge"></div>
      </div>
      <button id="quitBtn" class="btn ghost" style="padding:7px 10px;font-size:12px">終了</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div id="question" class="q"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>
    <div class="actions"><button id="nextBtn" class="btn primary hidden">次の問題へ</button></div>
  </div>

  <div id="result" class="result hidden">
    <div class="eyebrow">RESULT</div>
    <div class="score" id="score"></div>
    <div class="rank" id="rank"></div>
    <div class="small" id="message"></div>
    <div class="grid">
      <div class="stat">正答率<b id="pct"></b></div>
      <div class="stat">難問正解<b id="hard"></b></div>
    </div>
    <div class="actions" style="justify-content:center;margin-top:22px">
      <button id="retryBtn" class="btn secondary">最初に戻る</button>
      <button id="shareBtn" class="btn primary">Xで結果をシェア</button>
    </div>
  </div>
</main>
<div class="footer">※教育目的のクイズです。実臨床では患者ごとの病態、年齢、施設基準、最新ガイドライン等を踏まえて判断してください。</div>
</div>

<script>
const allQuestions = [{"c": "初期評価", "d": "基本", "q": "小児救急で、患者を見た瞬間の第1印象を評価するPATの3要素に含まれないものはどれ？", "o": ["Appearance（外観）", "Work of Breathing（呼吸状態）", "Circulation to the skin（皮膚への循環）", "Blood glucose（血糖）"], "a": 3, "e": "PATは Appearance・Work of Breathing・Circulation to the skin の3要素で評価します。"}, {"c": "初期評価", "d": "基本", "q": "PATのAppearanceでみる項目として最も適切なのはどれ？", "o": ["筋緊張や反応性", "血清Na値", "胸部X線所見", "尿培養結果"], "a": 0, "e": "Appearanceでは筋緊張、周囲への反応、慰めやすさ、視線、会話・啼泣などを観察します。"}, {"c": "初期評価", "d": "基本", "q": "保護者に抱かれても落ち着かず、普段と違う啼泣をしている児。この所見は主にPATのどこを悪化させる？", "o": ["Appearance", "Circulation to the skin", "血圧", "体温"], "a": 0, "e": "ConsolabilityやSpeech/Cryの異常はAppearanceの異常として捉えます。"}, {"c": "初期評価", "d": "基本", "q": "PATで皮膚循環不良を示唆する所見として適切なのはどれ？", "o": ["網状皮斑", "流涙", "鼻汁", "口内炎"], "a": 0, "e": "網状皮斑や蒼白などはCirculation to the skinの異常を示唆します。"}, {"c": "初期評価", "d": "基本", "q": "異常バイタルを認めたときの基本姿勢として適切なのはどれ？", "o": ["一度の測定なので無視する", "再度測定する", "翌日まで経過を見る", "体温だけ再測定する"], "a": 1, "e": "異常バイタルは放置せず、測定条件を確認して再評価します。"}, {"c": "初期評価", "d": "やや難", "q": "「なんだか様子が変」というGut feelingについて、小児科羅針盤で強調されている考え方はどれ？", "o": ["重症細菌感染症などを疑う手がかりになり得る", "必ず心理的問題である", "採血より常に優先される診断法である", "気にしなくてよい"], "a": 0, "e": "小児では第一印象や違和感が重症病態の早期認識につながることがあります。"}, {"c": "初期評価", "d": "基本", "q": "小児の急変時、ABCのAが示すものはどれ？", "o": ["Airway", "Appearance", "Allergy", "Activity"], "a": 0, "e": "ABCのAはAirway（気道）です。"}, {"c": "初期評価", "d": "基本", "q": "小児の急変時、ABCのBが示すものはどれ？", "o": ["Breathing", "Blood glucose", "Behavior", "Body temperature"], "a": 0, "e": "ABCのBはBreathing（呼吸）です。"}, {"c": "初期評価", "d": "基本", "q": "小児の急変時、ABCのCが示すものはどれ？", "o": ["Circulation", "Cry", "Consciousness", "Cough"], "a": 0, "e": "ABCのCはCirculation（循環）です。"}, {"c": "初期評価", "d": "難", "q": "重篤感があり、ショック・敗血症・心筋炎などを疑う児で、乳酸値を見る主な目的はどれ？", "o": ["組織低灌流の評価", "アレルギー診断", "骨年齢評価", "聴力評価"], "a": 0, "e": "乳酸は組織低灌流や代謝異常の評価に役立ちます。小児科羅針盤ではLac 4以上を異常の目安として記載しています。"}, {"c": "発熱・感染", "d": "基本", "q": "生後3か月未満の発熱で特に重要なのはどれ？", "o": ["低リスクと決めつける", "重症感染症を念頭に慎重に評価する", "必ず自宅経過観察とする", "解熱剤のみで終了する"] let quiz=[],idx=0,score=0,hardTotal=0,hardCorrect=0,locked=false;

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function startQuiz(n,random){
  quiz = random ? shuffle(allQuestions).slice(0,n) : [...allQuestions];
  idx=0;score=0;hardTotal=0;hardCorrect=0;
  $("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  render();
}

function render(){
  locked=false;
  const item=quiz[idx];
  $("counter").textContent=`Q${idx+1} / ${quiz.length}`;
  $("category").textContent=item.c;
  $("difficulty").textContent=item.d;
  $("bar").style.width=`${(idx/quiz.length)*100}%`;
  $("question").textContent=item.q;
  $("options").innerHTML="";
  $("feedback").className="feedback";
  $("feedback").textContent="";
  $("nextBtn").classList.add("hidden");
  item.o.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="option"; b.textContent=text;
    b.onclick=()=>answer(i,b);
    $("options").appendChild(b);
  });
}

function answer(i,btn){
  if(locked)return; locked=true;
  const item=quiz[idx];
  const buttons=[...document.querySelectorAll("button.option")];
  buttons.forEach((b,j)=>{b.disabled=true;if(j===item.a)b.classList.add("correct")});
  const isHard=item.d==="難"||item.d==="やや難";
  if(isHard) hardTotal++;
  if(i===item.a){
    score++; if(isHard)hardCorrect++;
    $("feedback").className="feedback ok";
    $("feedback").textContent="○ 正解　"+item.e;
  } else {
    btn.classList.add("wrong");
    $("feedback").className="feedback ng";
    $("feedback").textContent="× 不正解　"+item.e;
  }
  $("nextBtn").textContent=idx===quiz.length-1?"結果を見る":"次の問題へ";
  $("nextBtn").classList.remove("hidden");
}

$("nextBtn").onclick=()=>{
  idx++;
  if(idx<quiz.length){render();window.scrollTo({top:0,behavior:"smooth"})}
  else showResult();
};

function showResult(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  const p=Math.round(score/quiz.length*100);
  $("score").textContent=`${score} / ${quiz.length}`;
  $("pct").textContent=p+"%";
  $("hard").textContent=`${hardCorrect} / ${hardTotal}`;
  let rank,msg;
  if(p>=90){rank="小児科羅針盤 マスター";msg="かなり仕上がっています。難問も含めて高得点です。"}
  else if(p>=75){rank="かなり良好";msg="実践的な基礎はしっかり。間違えた分野を復習するとさらに強くなります。"}
  else if(p>=60){rank="あと一歩";msg="重要ポイントは押さえています。Red Flagと初期対応を中心に復習がおすすめです。"}
  else{rank="復習チャンス";msg="PAT、低月齢発熱、呼吸、痙攣、脱水、嘔吐のRed Flagから復習してみましょう。"}
  $("rank").textContent=rank;$("message").textContent=msg;
  window.scrollTo({top:0,behavior:"smooth"});
}

$("retryBtn").onclick=()=>{$("result").classList.add("hidden");$("start").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})};
$("quitBtn").onclick=()=>{if(confirm("クイズを終了しますか？")){$("quiz").classList.add("hidden");$("start").classList.remove("hidden")}};

$("shareBtn").onclick=()=>{
  const p=Math.round(score/quiz.length*100);
  const text=`小児科羅針盤｜小児救急クイズに挑戦\n結果：${score}/${quiz.length}問正解（${p}%）\n#小児救急 #小児科羅針盤`;
  const url=location.href.startsWith("http")?location.href:"";
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,"_blank");
};
